---
# Here are some helpful commands for manipulating the
# configuration/schema/database/whatever that gnome uses to maintain these
# settings. This (https://askubuntu.com/a/249924) suggests that `gsettings` is
# preferred, but the dump/watch parts of dconf make it easier to use most of
# the time.
#
#   dconf dump > /tmp/dconf.dump
#   dconf watch /
#   gsettings monitor org.gnome.settings-daemon.plugins.media-keys
#
#   dconf write /org/gnome/settings-daemon/plugins/media-keys/terminal "['<Super>t']"
#   gsettings set org.gnome.settings-daemon.plugins.media-keys terminal "['<Super>t']"
#
#   dconf reset /org/gnome/settings-daemon/plugins/media-keys/terminal
#   gsettings reset org.gnome.settings-daemon.plugins.media-keys terminal
#
#
# To dump everything, do:
#   dconf dump / > dconf-new.txt
# To just read a key do:
#   dconf read /org/gnome/desktop/screensaver/lock-enabled
# or
#
# Also could try things like this here:
#   gsettings set org.compiz.core:/org/compiz/profiles/unity/plugins/core/ hsize 6
#   gsettings get org.compiz.core:/org/compiz/profiles/unity/plugins/core/ hsize
#   gsettings list-keys org.compiz.wall:/
#   gsettings get org.gnome.Terminal.ProfilesList default

# Configure mouse scrolling
- shell: gsettings set org.gnome.desktop.peripherals.mouse natural-scroll false
- shell: gsettings set org.gnome.desktop.peripherals.touchpad natural-scroll false
- shell: gsettings set org.gnome.desktop.peripherals.touchpad two-finger-scrolling-enabled true
- shell: gsettings set org.gnome.desktop.peripherals.touchpad click-method 'fingers'

# Configure power settings
- shell: gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-type 'nothing'
- shell: gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing'

# Configure gnome Terminal
- shell: gsettings set org.gnome.desktop.interface gtk-enable-primary-paste true

# Configure Ptyxis (gnome terminal)
- shell: gsettings set org.gnome.Ptyxis restore-session false

- name: Lookup Ptyxis default profile
  shell: gsettings get org.gnome.Ptyxis default-profile-uuid | tr -d "'"
  register: ptyxis_profile

- shell: dconf write "/org/gnome/Ptyxis/Profiles/{{ ptyxis_profile.stdout }}/limit-scrollback" false
- shell: dconf write "/org/gnome/Ptyxis/Profiles/{{ ptyxis_profile.stdout }}/login-shell" true

# Configure workspaces/dock
- shell: gsettings set org.gnome.mutter workspaces-only-on-primary false
- shell: gsettings set org.gnome.shell.app-switcher current-workspace-only true
- shell: gsettings set org.gnome.shell.extensions.dash-to-dock dock-fixed false
- shell: gsettings set org.gnome.shell.extensions.dash-to-dock isolate-workspaces true
- shell: gsettings set org.gnome.shell.extensions.tiling-assistant tiling-popup-all-workspace false

# Configure file chooser / nautilus
- shell: gsettings set org.gnome.nautilus.preferences default-folder-viewer 'list-view'
- shell: gsettings set org.gtk.gtk4.Settings.FileChooser show-hidden true

