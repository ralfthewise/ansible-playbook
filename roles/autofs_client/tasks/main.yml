---
- name: Install autofs
  become: True
  apt: name=autofs state=latest

- name: Include adams config
  become: True
  copy:
    dest: /etc/auto.master.d/adams.autofs
    content: "/- /etc/auto.adams\n"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart autofs

- name: Install adams config
  become: True
  copy: src=roles/autofs_client/files/auto.adams dest=/etc/auto.adams owner=root group=root mode=0644
  notify:
    - Restart autofs
